<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Sample usage of SDesign.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="example">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>

  <title>SDesign Package</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="background-color: #121212; margin: 0; padding: 0;">
  <div id="loading-indicator" style="
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #121212;
      color: white;
      font-family: system-ui, -apple-system, sans-serif;
      transition: opacity 0.5s ease;
      z-index: 9999;
  ">
    <!-- Spinner -->
    <div style="
        border: 4px solid rgba(255, 255, 255, 0.1);
        border-top: 4px solid #03DAC6;
        border-radius: 50%;
        width: 48px;
        height: 48px;
        animation: spin 1s linear infinite;
        margin-bottom: 24px;
    "></div>
    <div style="font-weight: 500; font-size: 16px; letter-spacing: 1px;">SDesign is loading...</div>
    
    <style>
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  
  <script>
    // Remove the loading screen smoothly once Flutter renders the first frame.
    // NOTE: We don't call _flutter.loader.load() manually anymore because flutter_bootstrap.js
    // automatically handles the engine initialization in modern Flutter.
    window.addEventListener('flutter-first-frame', function() {
      const loader = document.getElementById('loading-indicator');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => {
          loader.remove();
        }, 500); // Wait for fade out
      }
    });
  </script>
</body>
</html>
